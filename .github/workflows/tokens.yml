name: Design tokens

# The design-system gate. `main` is protected and requires this job (`tokens`) to pass before a pull request
# merges. Every step prints what to run to fix it.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the change-discipline step compares against the base branch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Generated token files must match the Figma export in tokens/figma/ (run `npm run tokens:build` to fix).
      - run: npm run tokens:check
      # DESIGN.md must match the tokens and tokens/usage.json, and every token needs a usage (`npm run design:build`).
      - run: npm run design:check
      # Generated component descriptions and the catalog index must match components.json (`npm run descriptions:build`).
      - run: npm run descriptions:check
      # No raw colours, no unexcused arbitrary values, exceptions carry a reason, no new old intent words.
      - run: npm run lint:tokens
      # Raw <button>/<input>/<select>/<textarea> and @radix-ui imports in screens are warnings; warnings fail here.
      - run: npx eslint src --max-warnings=0
      - run: npx tsc --noEmit
      - run: npm run build
      # Change discipline (warnings, not blocking): a pull request that changes a component ticks a change type in
      # the template and adds a CHANGELOG.md line.
      - name: Change type and changelog
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: origin/${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          components=$(printf '%s\n' "$changed" | grep -E '^src/components/.+\.tsx?$' | grep -v '\.stories\.tsx$' || true)
          [ -n "$components" ] || { echo "No component files changed."; exit 0; }
          printf '%s\n' "$changed" | grep -qx 'CHANGELOG.md' \
            || echo "::warning::src/components changed without a CHANGELOG.md line. Add '- <type>(<Component>): <what> — <why> (#<PR>)' under Unreleased."
          printf '%s' "$PR_BODY" | grep -Eiq '^- \[x\] (create|refine|extend|refactor)' \
            || echo "::warning::No change type ticked in the PR description. Tick one of create, refine, extend, refactor (.github/pull_request_template.md)."
